<div class="page-header">
    <h2>Plant Inventory</h2>
</div>


<div class="container-fluid">
    <div class="row g-3">
        <div class="col-lg-5">
            <div class="card">

                <input type="hidden" id="plantId">

                <div class="row">

                    <div class="col-md-4">

                        <label>Observation No</label>

                        <input id="txtObservationNo" class="form-control" readonly>

                    </div>

                    <div class="col-md-4">

                        <label>Species</label>

                        <select id="cmbSpecies" class="form-select">
                        </select>

                    </div>

                    <div class="col-md-4">

                        <label>Beat</label>

                        <select id="cmbBeat" class="form-select">
                        </select>

                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-4">

                        <label>Condition</label>

                        <select id="cmbCondition" class="form-select">
                        </select>

                    </div>

                    <div class="col-md-4">

                        <label>Age Class</label>

                        <input id="txtAgeClass" class="form-control">

                    </div>

                    <div class="col-md-4">

                        <label>Observed On</label>

                        <input type="date" id="dtObservedOn" class="form-control">

                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-3">

                        <label>Latitude</label>

                        <input id="txtLatitude" class="form-control">

                    </div>

                    <div class="col-md-3">

                        <label>Longitude</label>

                        <input id="txtLongitude" class="form-control">

                    </div>

                    <div class="col-md-3">

                        <label>GPS Accuracy</label>

                        <input id="txtAccuracy" class="form-control">

                    </div>

                    <div class="col-md-3">

                        <label>Observed By</label>

                        <input id="txtObservedBy" class="form-control">

                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-12">

                        <label>Remarks</label>

                        <textarea id="txtRemarks" class="form-control" rows="3">
            </textarea>

                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-6">

                        <label class="form-label">

                            Plant Photograph

                        </label>

                        <input type="file" id="filePhoto" class="form-control" accept=".jpg,.jpeg,.png,.webp">

                    </div>

                    <div class="col-md-6 text-center">

                        <img id="photoPreview" src="" style="
                    display:none;
                    max-width:250px;
                    max-height:250px;
                    border:1px solid #ccc;
                    border-radius:8px;
                    padding:5px;">

                    </div>

                </div>

            </div>



        </div>

    <div class="col-lg-7">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">🗺 Plant Location</h5>
            </div>
            <div class="card-body">
                <div id="map" style="
        height:520px;
        margin-top:20px;
        border:1px solid #ccc;">
                </div>
            </div>
        </div>
    </div>
</div>

</div>

<div class="text-center mt-3 mb-4">
    <div class="mt-4">

        <button id="btnSave" class="btn btn-success">

            Save

        </button>

        <button id="btnUpdate" class="btn btn-warning">

            Update

        </button>

        <button id="btnDelete" class="btn btn-danger">

            Delete

        </button>

        <button id="btnClear" class="btn btn-secondary">

            Clear

        </button>

    </div>
</div>

<style>
    #map {
        height:430px !important;
        width:100%;
        border-radius:10px;
        border:1px solid #ced4da;
        box-shadow:0 2px 8px rgba(0,0,0,.12);
    }

    .card {
        border-radius: 10px;
    }

    .mt-4>.btn {
        min-width: 140px;
        margin: 0 6px;
    }
</style>

</div>
<table id="tblPlants" class="table table-striped table-bordered" width="100%">

    <thead>

        <tr>

            <th>Observation No</th>
            <th>Species</th>
            <th>Beat</th>
            <th>Condition</th>
            <th>Observed On</th>
            <th>Action</th>

        </tr>

    </thead>

    <tbody>

    </tbody>

</table>

<script src="../js/config.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- jQuery (Required for DataTables) -->
<!-- ========================================================= -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- ========================================================= -->
<!-- DataTables -->
<!-- ========================================================= -->

<script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>

<script src="https://cdn.datatables.net/2.3.2/js/dataTables.bootstrap5.js"></script>

<!-- ========================================================= -->
<!-- SweetAlert2 -->
<!-- ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- ========================================================= -->
<!-- Application -->
<!-- ========================================================= -->

<script src="../js/config.js"></script>

<script src="../js/api.js"></script>

<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>


<script src="../js/plant_inventory.js"></script>

</body>

</html>

<!-- ==========================================================
     Forest Divisions Management
=========================================================== -->

<div class="container-fluid">

    <div class="row mb-3">

        <div class="col-md-6">
            <h3>
                <i class="bi bi-diagram-3-fill"></i>
                Forest Divisions
            </h3>
        </div>

        <div class="col-md-6 text-end">

            <button class="btn btn-success" id="btnAddDivision">

                <i class="bi bi-plus-circle"></i>
                Add Division

            </button>

        </div>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <table id="tblDivisions" class="table table-striped table-hover align-middle">

                <thead class="table-dark">

                    <tr>

                        <th width="80">ID</th>

                        <th>Division</th>

                        <th>Description</th>

                        <th width="120">Status</th>

                        <th width="150">Created</th>

                        <th width="160" class="text-center">

                            Actions

                        </th>

                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </div>

    </div>

</div>



<!-- ==============================================
     Bootstrap Modal
============================================== -->

<div class="modal fade" id="divisionModal" tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 id="divisionModalTitle" class="modal-title">

                    Forest Division

                </h5>

                <button class="btn-close" data-bs-dismiss="modal">

                </button>

            </div>


            <div class="modal-body">

                <input type="hidden" id="divisionId">


                <div class="mb-3">

                    <label class="form-label">

                        Division Name

                    </label>

                    <input id="divisionName" class="form-control">

                </div>


                <div class="mb-3">

                    <label class="form-label">

                        Description

                    </label>

                    <textarea id="divisionDescription" rows="3" class="form-control">

                    </textarea>

                </div>


                <div class="form-check">

                    <input id="divisionActive" type="checkbox" class="form-check-input" checked>

                    <label class="form-check-label">

                        Active

                    </label>

                </div>

            </div>


            <div class="modal-footer">

                <button class="btn btn-secondary" data-bs-dismiss="modal">

                    Close

                </button>

                <button id="btnSaveDivision" class="btn btn-primary">

                    Save

                </button>

            </div>

        </div>

    </div>

</div>

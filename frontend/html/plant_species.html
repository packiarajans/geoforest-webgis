<!-- ========================================================= -->
<!-- Species Form -->
<!-- ========================================================= -->

<div class="card shadow mt-4">

    <div class="card-header bg-success text-white">

        <h5 class="mb-0">

            <i class="bi bi-flower1"></i>

            Plant Species Information

        </h5>

    </div>

    <div class="card-body">

        <input type="hidden" id="speciesId">

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Scientific Name

                </label>

                <input type="text" id="txtScientificName" class="form-control">

            </div>

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Common Name

                </label>

                <input type="text" id="txtCommonName" class="form-control">

            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Family

                </label>

                <input type="text" id="txtFamily" class="form-control">

            </div>

            <div class="col-md-3 mb-3">

                <label>Origin Type</label>

                <select id="cmbOriginType" class="form-select">

                    <option value="">Select...</option>

                    <option value="Native">Native</option>

                    <option value="Invasive">Invasive</option>

                    <option value="Exotic">Exotic</option>

                    <option value="Endemic">Endemic</option>

                    <option value="Naturalized">Naturalized</option>

                    <option value="Cultivated">Cultivated</option>

                    <option value="Unknown">Unknown</option>

                </select>
            </div>

        </div>

        <div class="col-md-3 mb-3">

            <label class="form-label">

                Category

            </label>

            <select id="cmbCategory" class="form-select">

            </select>

        </div>

        <div class="col-md-3 mb-3">

            <label class="form-label">

                IUCN Status

            </label>

            <select id="cmbIUCN" class="form-select">

            </select>

        </div>

    </div>

    <div class="row">

        <div class="col-md-2 mb-3">

            <label class="form-label">

                Active

            </label>

            <div>

                <input class="form-check-input" type="checkbox" id="chkActive" checked>

            </div>

        </div>

    </div>

    <hr>

    <button id="btnSave" class="btn btn-success">

        <i class="bi bi-save"></i>

        Save

    </button>

    <button id="btnUpdate" class="btn btn-primary">

        <i class="bi bi-pencil-square"></i>

        Update

    </button>

    <button id="btnDelete" class="btn btn-danger">

        <i class="bi bi-trash"></i>

        Delete

    </button>

    <button id="btnClear" class="btn btn-secondary">

        <i class="bi bi-arrow-clockwise"></i>

        Clear

    </button>

</div>

</div>

<!-- ========================================================= -->
<!-- Search -->
<!-- ========================================================= -->

<div class="card shadow mt-4">

    <div class="card-header bg-success text-white">

        <h5 class="mb-0">

            <i class="bi bi-search"></i>

            Search

        </h5>

    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-6">

                <input type="text" id="txtSearch" class="form-control"
                    placeholder="Search Scientific Name / Common Name">

            </div>

        </div>

    </div>

</div>

<!-- ========================================================= -->
<!-- Species Grid -->
<!-- ========================================================= -->

<div class="card shadow mt-4 mb-4">

    <div class="card-header bg-success text-white">

        <h5 class="mb-0">

            <i class="bi bi-table"></i>

            Plant Species List

        </h5>

    </div>

    <div class="card-body">

        <div class="table-responsive">

            <table id="tblSpecies" class="table table-striped table-bordered table-hover w-100">

                <thead class="table-success">

                    <tr>

                        <th>ID</th>

                        <th>Scientific Name</th>

                        <th>Common Name</th>

                        <th>Family</th>

                        <th>Origin</th>

                        <th>Category</th>

                        <th>IUCN Status</th>

                        <th>Active</th>

                        <th width="90">Edit</th>

                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </div>

    </div>

</div>

</div>

<!-- ========================================================= -->
<!-- Loading Spinner -->
<!-- ========================================================= -->

<div id="loadingSpinner" class="spinner-overlay d-none">

    <div class="spinner-border text-success" style="width:4rem;height:4rem;" role="status">

        <span class="visually-hidden">

            Loading...

        </span>

    </div>

</div>
